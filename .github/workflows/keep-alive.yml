name: Keep backend awake

# Render's free tier spins the web service down after 15 minutes with no
# inbound traffic, and the next real request then waits 30-60s for a cold
# start. This pings the health endpoint every 10 minutes — comfortably
# inside that 15-minute window — so the service never goes idle long enough
# to sleep in the first place.
#
# This is a workaround, not a guarantee: GitHub's own scheduler can run a
# few minutes late under load, and it does nothing for Render's separate
# 30-day free-database expiry. For a service this relies on, Render's
# Starter plan ($7/mo) removes the spin-down outright instead of working
# around it.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 60 https://fim-api-rtze.onrender.com/health \
            || echo "Ping failed or timed out — likely mid cold-start, not a real failure."
