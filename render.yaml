# One-click deploy blueprint: creates the API service + Postgres database on Render.
# Secrets marked `sync: false` are entered by you in Render's dashboard — never stored in this repo.
databases:
  - name: fim-db
    plan: free
    databaseName: fim
    user: fim

services:
  - type: web
    name: fim-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: fim-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_DEEP_LINK_SCHEME
        value: freeinvoicemaker
      - key: PLATFORM_FEE_PERCENT
        value: "0.01"
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
